<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Without-Redux</title>
    <style>
      .container {
        border: 5px solid black;
        padding: 10px;
      }
    </style>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/redux/4.2.1/redux.js"
      integrity="sha512-Olr8rkMYuxq3KpAPjYA/mAVYe7EIEP4RkhoAvD/qOrlauzE4CTvpQSg/cRX0/5Qreret4aobD0vg1xtjBqR7VA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>

  <body>
    <div id="red"></div>
    <div id="blue"></div>
    <div id="green"></div>
    <script>
      function reducer(state, action) {
        console.log(state, action);
        if (state == undefined) {
          return { color: 'yellow' }; // 초기 state 값.
        }
        let newState;

        if (action.type === 'CHANGE_COLOR') {
          newState = Object.assign({}, state, { color: action.color }); // 기존 상태는 보존하고 새로 복사해서 리턴하게 한다., 가장 중요한 부준.
        }
        console.log(action.type, action, state, newState);
        return newState;
      }

      const store = Redux.createStore(
        reducer,
        /* preloadedState, */ window.__REDUX_DEVTOOLS_EXTENSION__ &&
          window.__REDUX_DEVTOOLS_EXTENSION__(),
      );

      console.log(store.getState());

      function red() {
        const state = store.getState();
        document.querySelector('#red').innerHTML = `
          <div class="container" id="component_red" style="background-color:${state.color}">
            <h1>red</h1>
            <input type="button" value="fire" onclick="
              store.dispatch({type:'CHANGE_COLOR', color: 'red'});
            ">
          </div>
        `;
      }
      store.subscribe(red);
      red();

      function blue() {
        const state = store.getState();
        document.querySelector('#blue').innerHTML = `
          <div class="container" id="component_blue" style="background-color:${state.color}">
            <h1>blue</h1>
            <input type="button" value="fire" onclick="
              store.dispatch({type:'CHANGE_COLOR', color: 'blue'});
            ">
          </div>
        `;
      }
      store.subscribe(blue);
      blue();

      function green() {
        const state = store.getState();
        document.querySelector('#green').innerHTML = `
          <div class="container" id="component_blue" style="background-color:${state.color}">
            <h1>green</h1>
            <input type="button" value="fire" onclick="
              store.dispatch({type:'CHANGE_COLOR', color: 'green'});
            ">
          </div>
        `;
      }
      store.subscribe(green);
      green();
    </script>
  </body>
</html>
