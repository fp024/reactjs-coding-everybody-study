<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Redux Study</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/redux/4.2.1/redux.js"
      integrity="sha512-Olr8rkMYuxq3KpAPjYA/mAVYe7EIEP4RkhoAvD/qOrlauzE4CTvpQSg/cRX0/5Qreret4aobD0vg1xtjBqR7VA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <div id="subject"></div>
    <div id="toc"></div>
    <div id="control"></div>
    <div id="content"></div>

    <script>
      function subject() {
        document.querySelector('#subject').innerHTML = `
        <header>
          <h1>WEB</h1>
        </header>
        `;
      }
      function TOC() {
        const state = store.getState();
        const lisHTML = state.contents
          .map((article) => {
            return `
            <li>
              <a onclick="
                event.preventDefault();
                const action = {type:'SELECT', id: ${article.id}};
                store.dispatch(action);
              " href="${article.id}.html">${article.title}</a>
            </li>`;
          })
          .join('');
        document.querySelector('#toc').innerHTML = `
        <nav>
          <ol>
            ${lisHTML}
          </ol>
        </nav>
        `;
      }
      function controll() {
        document.querySelector('#control').innerHTML = `
        <ul>
          <li><a onclick="
            event.preventDefault();
            const action = {type:'CHANGE_MODE', mode: 'create'};
            store.dispatch(action);
            "
            href="/create">create</a></li>
          <li><input onclick="
            store.dispatch({
              type:'DELETE'
            })
            " type="button" value="delete"></li>
        </ul>
        `;
      }

      function article() {
        const state = store.getState();
        if (state.mode === 'create') {
          document.querySelector('#content').innerHTML = `
          <article>    
            <form onsubmit="
              event.preventDefault();
              const _title = this.title.value;
              const _desc = this.desc.value;
              store.dispatch({
                type:'CREATE',
                title: _title,
                desc: _desc
              })
            ">
              <p>
                <input type="text" name="title" placeholder="title">
              </p>
              <p>
                <textarea name="desc" placeholder="description"></textarea>
              </p>
              <p>
                <input type="submit">
              </p>
            </form>
          </article>
        `;
        } else if (state.mode === 'read') {
          const selectedArticle = state.contents.find((a) => a.id === state.selected_id);

          if (selectedArticle == null) {
            document.querySelector('#content').innerHTML = `
            <article>    
              <h2>Data Empty</h2>
              ...              
            </article>
            `;
          } else {
            document.querySelector('#content').innerHTML = `
            <article>    
              <h2>${selectedArticle.title}</h2>
              ${selectedArticle.desc}
            </article>
            `;
          }
        }
      }

      function reducer(state, action) {
        if (state == undefined) {
          return {
            max_id: 2,
            mode: 'read',
            selected_id: 1,
            contents: [
              { id: 1, title: 'HTML', desc: 'HTML is ...' },
              { id: 2, title: 'CSS', desc: 'CSS is ...' },
            ],
          };
        }

        let newState = {};
        if (action.type === 'SELECT') {
          newState = Object.assign({}, state, { selected_id: action.id, mode: 'read' });
        } else if (action.type === 'CHANGE_MODE') {
          newState = Object.assign({}, state, { mode: action.mode });
        } else if (action.type === 'CREATE') {
          const newMaxId = state.max_id + 1;
          const newContent = {
            id: newMaxId,
            title: action.title,
            desc: action.desc,
          };

          newState = Object.assign({}, state, {
            max_id: newContent.id,
            selected_id: newContent.id,
            contents: state.contents.concat(newContent),
            mode: 'read',
          });
        } else if (action.type === 'DELETE') {
          const newContents = state.contents.filter((c) => c.id != state.selected_id);
          const newSelectedId =
            newContents.length === 0 ? null : newContents[newContents.length - 1].id;

          newState = Object.assign({}, state, {
            selected_id: newSelectedId,
            contents: newContents,
            mode: 'read',
          });
        }

        console.log(action, state, newState);
        return newState;
      }

      const store = Redux.createStore(
        reducer,
        /* preloadedState, */ window.__REDUX_DEVTOOLS_EXTENSION__ &&
          window.__REDUX_DEVTOOLS_EXTENSION__(),
      );
      store.subscribe(TOC);
      store.subscribe(article);

      subject();
      TOC();
      controll();
      article();
    </script>
  </body>
</html>
